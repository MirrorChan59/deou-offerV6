<!-- 服务流程步骤占位图（运营可在配置后台替换为真实截图/照片，建议 4:3） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="sp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/><stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sp-bg)"/>
  <rect x="1.5" y="1.5" width="397" height="297" rx="10" stroke="#bfdbfe" stroke-width="3" stroke-dasharray="10 8" fill="none"/>
  <g transform="translate(160 96)">
    <rect x="0" y="0" width="80" height="64" rx="10" fill="#fff" stroke="#93c5fd" stroke-width="3"/>
    <circle cx="22" cy="20" r="6" fill="#93c5fd"/>
    <polyline points="8,52 30,32 44,44 58,28 72,52" stroke="#60a5fa" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="200" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#3b82f6">服务流程示意图</text>
  <text x="200" y="226" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12.5" fill="#64748b">运营可替换 · 建议尺寸 4:3</text>
</svg>
