<!-- 首页 Hero 插图：求职辅导服务示意（运营可替换） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" fill="none">
  <defs>
    <linearGradient id="hd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="hd-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="560" height="420" rx="24" fill="url(#hd-bg)"/>
  <circle cx="470" cy="60" r="110" fill="rgba(255,255,255,.07)"/>
  <circle cx="80" cy="370" r="90" fill="rgba(255,255,255,.05)"/>

  <!-- 主卡：Offer 进度面板 -->
  <rect x="52" y="56" width="330" height="308" rx="18" fill="#fff"/>
  <rect x="76" y="84" width="120" height="14" rx="7" fill="#e2e8f0"/>
  <rect x="76" y="110" width="180" height="22" rx="8" fill="#2563eb"/>
  <text x="88" y="126" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">Offer 冲刺进度</text>

  <!-- 进度条 -->
  <rect x="76" y="152" width="282" height="12" rx="6" fill="#eff6ff"/>
  <rect x="76" y="152" width="216" height="12" rx="6" fill="#22c55e"/>
  <rect x="76" y="176" width="282" height="12" rx="6" fill="#eff6ff"/>
  <rect x="76" y="176" width="172" height="12" rx="6" fill="#3b82f6"/>
  <rect x="76" y="200" width="282" height="12" rx="6" fill="#eff6ff"/>
  <rect x="76" y="200" width="128" height="12" rx="6" fill="#818cf8"/>

  <!-- 柱状图 -->
  <rect x="76" y="240" width="282" height="100" rx="12" fill="#f8fafc"/>
  <rect x="100" y="292" width="26" height="36" rx="5" fill="url(#hd-bar)"/>
  <rect x="140" y="278" width="26" height="50" rx="5" fill="url(#hd-bar)"/>
  <rect x="180" y="262" width="26" height="66" rx="5" fill="url(#hd-bar)"/>
  <rect x="220" y="284" width="26" height="44" rx="5" fill="url(#hd-bar)"/>
  <rect x="260" y="252" width="26" height="76" rx="5" fill="url(#hd-bar)"/>
  <rect x="300" y="270" width="26" height="58" rx="5" fill="url(#hd-bar)"/>

  <!-- 浮卡 1：Offer 通知 -->
  <g>
    <rect x="330" y="96" width="196" height="86" rx="16" fill="#fff"/>
    <circle cx="362" cy="126" r="17" fill="#dcfce7"/>
    <path d="M355 126 l5 5 10 -11" stroke="#16a34a" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="388" y="112" width="106" height="12" rx="6" fill="#0f172a" opacity=".85"/>
    <rect x="388" y="132" width="78" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="388" y="152" width="58" height="16" rx="8" fill="#eff6ff"/>
    <text x="398" y="164" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#2563eb">已拿 Offer</text>
  </g>

  <!-- 浮卡 2：面试邀约 -->
  <g>
    <rect x="352" y="206" width="176" height="76" rx="16" fill="#fff"/>
    <circle cx="382" cy="234" r="15" fill="#dbeafe"/>
    <rect x="377" y="226" width="10" height="16" rx="2" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <rect x="404" y="222" width="96" height="11" rx="5.5" fill="#0f172a" opacity=".85"/>
    <rect x="404" y="241" width="70" height="9" rx="4.5" fill="#cbd5e1"/>
    <rect x="404" y="258" width="52" height="15" rx="7.5" fill="#fdf4ff"/>
    <text x="413" y="269" font-family="system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#a21caf">面试邀约</text>
  </g>

  <!-- 浮卡 3：导师在线 -->
  <g>
    <rect x="312" y="306" width="150" height="64" rx="16" fill="#fff"/>
    <circle cx="340" cy="338" r="16" fill="#e0e7ff"/>
    <path d="M340 330 a5 5 0 1 1 -0.01 0 M330 348 c0 -7 20 -7 20 0" stroke="#4f46e5" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <rect x="364" y="326" width="76" height="10" rx="5" fill="#0f172a" opacity=".85"/>
    <rect x="364" y="344" width="52" height="9" rx="4.5" fill="#cbd5e1"/>
    <circle cx="436" cy="349" r="5" fill="#22c55e"/>
  </g>

  <!-- 装饰 -->
  <path d="M496 40 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z" fill="#fde68a"/>
  <circle cx="42" cy="120" r="4" fill="#fff" opacity=".7"/>
</svg>
